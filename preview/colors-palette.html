<!doctype html>
<html><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;font-family:'Inter',system-ui,sans-serif;padding:20px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
.swatch{width:96px;height:96px;border-radius:14px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;flex-shrink:0}
.name{font-size:11px;font-weight:700;line-height:14px}
.hex{font-size:10px;font-weight:500;opacity:.75;margin-top:2px;font-family:monospace}
.group{display:flex;flex-direction:column;gap:4px}
.label{font-size:10px;font-weight:600;color:#6D8196;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
</style>
</head><body>
<div class="group">
  <div class="label">Core</div>
  <div style="display:flex;gap:8px">
    <div class="swatch" style="background:#000080"><span class="name" style="color:#ADD8E6">Navy</span><span class="hex" style="color:#ADD8E6">#000080</span></div>
    <div class="swatch" style="background:#ADD8E6"><span class="name" style="color:#000080">Sky</span><span class="hex" style="color:#000080">#ADD8E6</span></div>
    <div class="swatch" style="background:#E5F1F7"><span class="name" style="color:#3C4A5A">Sky Soft</span><span class="hex" style="color:#3C4A5A">#E5F1F7</span></div>
    <div class="swatch" style="background:#FFFAFA;border:1px solid #ECEAE5"><span class="name" style="color:#0A0A2A">Snow</span><span class="hex" style="color:#0A0A2A">#FFFAFA</span></div>
  </div>
</div>
<div class="group">
  <div class="label">Ink & Neutral</div>
  <div style="display:flex;gap:8px">
    <div class="swatch" style="background:#0A0A2A"><span class="name" style="color:#fff">Ink</span><span class="hex" style="color:#fff">#0A0A2A</span></div>
    <div class="swatch" style="background:#6D8196"><span class="name" style="color:#fff">Slate</span><span class="hex" style="color:#fff">#6D8196</span></div>
    <div class="swatch" style="background:#3C4A5A"><span class="name" style="color:#fff">Slate Ink</span><span class="hex" style="color:#fff">#3C4A5A</span></div>
    <div class="swatch" style="background:#ECEAE5"><span class="name" style="color:#3C4A5A">Hairline</span><span class="hex" style="color:#3C4A5A">#ECEAE5</span></div>
    <div class="swatch" style="background:#D6E5EE"><span class="name" style="color:#3C4A5A">Line</span><span class="hex" style="color:#3C4A5A">#D6E5EE</span></div>
  </div>
</div>
</body></html>
