<!doctype html>
<html><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#FFFAFA;font-family:'Inter',system-ui;padding:20px 24px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
button{font-family:'Inter',system-ui;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;border:none;letter-spacing:-.01em}
.meta{font-size:10px;color:#6D8196;text-align:center;margin-top:4px;font-family:monospace}
.col{display:flex;flex-direction:column;gap:4px;align-items:center}
</style>
</head><body>

<!-- Primary CTA -->
<div class="col">
  <button style="height:60px;padding:0 28px;border-radius:20px;background:#000080;color:#FFFAFA;font-size:16px;font-weight:700;box-shadow:0 10px 24px rgba(0,0,128,.28)">Solve this →</button>
  <div class="meta">Primary · 60h · r-20 · navy</div>
</div>

<!-- Secondary -->
<div class="col">
  <button style="height:60px;padding:0 24px;border-radius:20px;background:#fff;color:#0A0A2A;font-size:15px;font-weight:600;box-shadow:inset 0 0 0 1px #ECEAE5">Retake</button>
  <div class="meta">Secondary · 60h · hairline</div>
</div>

<!-- Small navy -->
<div class="col">
  <button style="height:44px;padding:0 18px;border-radius:14px;background:#000080;color:#FFFAFA;font-size:14px;font-weight:700;box-shadow:0 6px 16px rgba(0,0,128,.22)">Unlock</button>
  <div class="meta">Primary sm · 44h</div>
</div>

<!-- Tint button -->
<div class="col">
  <button style="height:34px;padding:0 14px;border-radius:10px;background:#E5F1F7;color:#000080;font-size:12px;font-weight:700">Edit</button>
  <div class="meta">Tint · 34h</div>
</div>

<!-- Pill upgrade -->
<div class="col">
  <button style="height:38px;padding:0 16px;border-radius:9999px;background:#000080;color:#FFFAFA;font-size:13px;font-weight:700;box-shadow:0 6px 16px rgba(0,0,128,.28)">⚡ Upgrade</button>
  <div class="meta">Pill CTA</div>
</div>

<!-- Disabled -->
<div class="col">
  <button style="height:60px;padding:0 28px;border-radius:20px;background:#E5F1F7;color:#6D8196;font-size:16px;font-weight:700;opacity:.6">Solve this</button>
  <div class="meta">Disabled state</div>
</div>

</body></html>
