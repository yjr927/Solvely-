<!doctype html>
<html><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#FFFAFA;font-family:'Inter',system-ui;padding:20px 24px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.meta{font-size:10px;color:#6D8196;margin-top:4px;font-family:monospace}
.col{display:flex;flex-direction:column;gap:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style>
</head><body>

<!-- Subject chips -->
<div class="col">
  <div class="row">
    <div style="padding:8px 14px;border-radius:9999px;background:#000080;color:#ADD8E6;font-size:13px;font-weight:700">Algebra</div>
    <div style="padding:8px 14px;border-radius:9999px;background:#fff;color:#0A0A2A;font-size:13px;font-weight:700;box-shadow:inset 0 0 0 1px #ECEAE5">Geometry</div>
    <div style="padding:8px 14px;border-radius:9999px;background:#fff;color:#0A0A2A;font-size:13px;font-weight:700;box-shadow:inset 0 0 0 1px #ECEAE5">Calculus</div>
  </div>
  <div class="meta">Subject chips · pill · 13px Inter 700</div>
</div>

<!-- Status badges -->
<div class="col">
  <div class="row">
    <div style="display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:9999px;background:#000080;color:#FFFAFA;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase">
      <span style="width:6px;height:6px;border-radius:3px;background:#ADD8E6;display:block"></span>
      1 question found
    </div>
    <div style="display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:9999px;background:#E5F1F7;color:#000080;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase">
      Algebra II
    </div>
    <div style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:9999px;background:#E5F1F7;color:#000080;font-size:11px;font-weight:700;letter-spacing:.04em">
      <span style="width:8px;height:8px;border-radius:4px;background:#000080;display:block"></span>
      SOLVELY IS THINKING
    </div>
  </div>
  <div class="meta">Status badges · pill · 10-11px CAPS</div>
</div>

<!-- Streak pill -->
<div class="col">
  <div style="height:27px;border-radius:9999px;background:#fff;box-shadow:inset 0 0 0 1px #ECEAE5;display:inline-flex;align-items:center;gap:6px;padding:0 10px 0 8px">
    <span style="font-size:14px">🔥</span>
    <span style="font-size:12px;font-weight:700;color:#0A0A2A">4-day streak</span>
    <span style="width:1px;height:12px;background:#ECEAE5"></span>
    <span style="font-size:12px;font-weight:500;color:#6D8196">3 free</span>
  </div>
  <div class="meta">Streak pill · white · hairline border</div>
</div>

<!-- Perk chip -->
<div class="col">
  <div class="row">
    <div style="padding:10px 12px;border-radius:12px;background:#E5F1F7;display:flex;align-items:center;gap:8px">
      <div style="width:16px;height:16px;border-radius:8px;background:#000080;display:flex;align-items:center;justify-content:center">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5 9-11" stroke="#ADD8E6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <span style="font-size:12px;font-weight:600;color:#000080">Full step-by-step</span>
    </div>
    <div style="padding:10px 12px;border-radius:12px;background:#E5F1F7;display:flex;align-items:center;gap:8px">
      <div style="width:16px;height:16px;border-radius:8px;background:#000080;display:flex;align-items:center;justify-content:center">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5 9-11" stroke="#ADD8E6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <span style="font-size:12px;font-weight:600;color:#000080">Flashcards</span>
    </div>
  </div>
  <div class="meta">Perk chip · sky-soft · navy check</div>
</div>

</body></html>
