<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Solvely · Interactive Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:#E8EAF0;
    display:flex;align-items:center;justify-content:center;
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;}
  button{font-family:'Inter',system-ui,sans-serif;}
  ::-webkit-scrollbar{display:none}
  *{scrollbar-width:none}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="proto-shared.jsx?v=20260522-tabs"></script>
<script type="text/babel" src="proto-home.jsx?v=20260522-tabs"></script>
<script type="text/babel" src="proto-camera.jsx?v=20260522-tabs"></script>
<script type="text/babel" src="proto-confirm-analyze.jsx?v=20260522-tabs"></script>
<script type="text/babel" src="proto-result-tabs.jsx?v=20260522-tabs"></script>

<script type="text/babel">
const { useState, useEffect } = React;

// ── Flow:
// home → camera → confirm → analyzing → result
// tab changes: scan/history/notes/me

function App() {
  const [screen, setScreen] = useState('home');   // home|camera|confirm|analyzing|result
  const [tab, setTab]       = useState('scan');
  const [scansLeft, setScansLeft] = useState(3);

  // When tab changes, reset to the appropriate tab screen
  const handleTab = (t) => {
    setTab(t);
    if (t === 'scan') setScreen('home');
    else setScreen(t); // 'history' | 'notes' | 'me'
  };

  const handleCapture = () => setScreen('camera');
  const handleShutter = () => setScreen('confirm');
  const handleSolve   = () => { setScansLeft(s=>Math.max(0,s-1)); setScreen('analyzing'); };
  const handleDone    = () => setScreen('result');
  const handleBack    = () => setScreen('home');
  const handleRetake  = () => setScreen('camera');

  // Decide which screen component to render
  const renderScreen = () => {
    switch(screen) {
      case 'home':      return <HomeScreen onCapture={handleCapture} onTab={handleTab}/>;
      case 'camera':    return <CameraScreen
                                 onShutter={handleShutter}
                                 onText={()=>alert('Type your question')}
                                 onGallery={handleShutter}
                                 onClose={()=>setScreen('home')}
                                 scansLeft={scansLeft}
                               />;
      case 'confirm':   return <ConfirmScreen onRetake={handleRetake} onSolve={handleSolve}/>;
      case 'analyzing': return <AnalyzingScreen onDone={handleDone}/>;
      case 'result':    return <ResultScreen
                                 onBack={handleBack}
                                 onUpgrade={()=>alert('Upgrade to Pro')}
                                 onShare={()=>alert('Share solution')}
                               />;
      case 'history':   return <HistoryScreen onTab={handleTab}/>;
      case 'notes':     return <NotesScreen onTab={handleTab}/>;
      case 'me':        return <MeScreen onTab={handleTab}/>;
      default:          return <HomeScreen onCapture={handleCapture} onTab={handleTab}/>;
    }
  };

  const isDark = screen === 'camera';

  return (
    <div style={{
      // On small screens, scale to fit
      transform: 'scale(var(--phone-scale,1))',
      transformOrigin: 'top center',
    }}>
      <Phone dark={isDark}>
        {renderScreen()}
      </Phone>
    </div>
  );
}

// Scale phone to fit viewport
function setScale() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = Math.min(vw / 390, vh / 844, 1);
  document.documentElement.style.setProperty('--phone-scale', scale);
  document.body.style.minHeight = (844 * scale) + 'px';
}
setScale();
window.addEventListener('resize', setScale);

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
