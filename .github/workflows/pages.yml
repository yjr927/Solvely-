name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir _site
          cp index.html _site/index.html
          cp proto-shared.jsx _site/proto-shared.jsx
          cp proto-home.jsx _site/proto-home.jsx
          cp proto-camera.jsx _site/proto-camera.jsx
          cp proto-confirm-analyze.jsx _site/proto-confirm-analyze.jsx
          cp proto-result-tabs.jsx _site/proto-result-tabs.jsx
          cp .nojekyll _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
